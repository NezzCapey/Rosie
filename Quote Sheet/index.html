<!-- Auto Section -->
<div class="section">
<h2>Auto Information</h2>
<div class="grid">
  <div><label>Current Auto Carrier</label><input type="text" name="autoCarrier" /></div>
  <div><label>Policy Renewal Date</label><input type="date" name="autoRenewal" /></div>
  <div><label>Policy Premium</label><input type="number" name="autoPremium" step="0.01" /></div>
  <div><label>Relationship to Client</label>
    <select name="relationshipToClient">
      <option>Spouse</option>
      <option>Child</option>
      <option>Other</option>
    </select>
  </div>
  <div><label>Bodily Injury</label>
    <select name="bodilyInjury">
      <option>25/50</option>
      <option>50/100</option>
      <option>100/300</option>
      <option>250/500</option>
    </select>
  </div>
  <div><label>Property Damage</label>
    <select name="propertyDamage">
      <option>State Minimum</option>
      <option>50k</option>
      <option>100k</option>
      <option>250k</option>
    </select>
  </div>
  <div><label>Uninsured Motorist Coverage</label>
    <select name="uninsuredMotorist">
      <option>State Minimum</option>
      <option>25/50</option>
      <option>50/100</option>
      <option>100/300</option>
    </select>
  </div>
  <div><label>Liability Limit Coverage</label>
    <select name="liabilityLimit">
      <option>25/50</option>
      <option>50/100</option>
      <option>100/300</option>
      <option>250/500</option>
    </select>
  </div>
  <div><label>Medical Coverage</label><input type="text" name="medicalCoverage" /></div>
  <div><label>Deductible Preference</label>
    <select name="deductiblePref"><option>250</option><option>500</option><option>1000</option></select>
  </div>
  <div><label>Comprehensive Deductible</label>
    <select name="compDeductible"><option>250</option><option>500</option><option>1000</option></select>
  </div>
  <div><label>Collision Deductible</label>
    <select name="collisionDeductible"><option>250</option><option>500</option><option>1000</option></select>
  </div>
  <div><label>Roadside</label>
    <select name="roadside"><option>Yes</option><option>No</option></select>
  </div>
  <div><label>Rental Reimbursement</label>
    <select name="rentalReimbursement"><option>50</option><option>100</option><option>250</option></select>
  </div>
  <div><label>Personal Injury Protection (PIP)</label>
    <select name="pip"><option>50</option><option>500</option></select>
  </div>
</div>

<h3>Vehicles</h3>
<div id="vehicleContainer">
<div class="vehicleBlock grid">
  <div><label>Year</label><input type="number" name="vehicleYear[]" min="1980" max="2026" /></div>
  <div><label>Make</label><input type="text" name="vehicleMake[]" /></div>
  <div><label>Model</label><input type="text" name="vehicleModel[]" /></div>
  <div><label>VIN Number</label><input type="text" name="vehicleVIN[]" /></div>
  <div><label>Length of Ownership</label><input type="text" name="vehicleLength[]" /></div>
  <div><label>Lienholder/Financing</label><input type="text" name="vehicleLien[]" /></div>
</div>
</div>
<button type="button" onclick="addVehicle()">Add Another Vehicle</button>
</div>
